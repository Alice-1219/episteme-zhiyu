<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d1e1c8">
<title>找回账号 · Episteme 知屿</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="styles.css">
<style>
.recovery-page{min-height:100vh;display:grid;place-items:center;padding:40px 20px;background:#faf9f6}
.recovery-card{width:min(500px,100%);background:#fffcf8;border:1px solid #e5e1da;border-radius:24px;padding:34px;box-shadow:0 20px 60px rgba(65,73,67,.08)}
.recovery-brand{text-align:center;margin-bottom:25px}.recovery-brand img{width:72px;height:72px;object-fit:contain}.recovery-brand h1{font:500 29px Georgia,"Songti SC",serif;color:#405149;margin:10px 0 5px}.recovery-brand p{font-size:9px;letter-spacing:1.5px;color:#929892;margin:0}
.recovery-card h2{font:500 23px Georgia,"Songti SC",serif;color:#43534c;margin:0 0 9px}.recovery-card .intro{font-size:12px;line-height:1.8;color:#858c87;margin-bottom:20px}.recovery-user{background:#f1f5ee;border-radius:13px;padding:14px 16px;margin-bottom:18px;font-size:12px;color:#65736b}.recovery-user b{display:block;font:500 20px Georgia,"Songti SC",serif;color:#4f6559;margin-top:4px}.recovery-card label{display:block;font-size:11px;color:#707872;margin-top:13px}.recovery-card input{display:block;width:100%;margin-top:6px;border:1px solid #e5e1da;background:#fff;border-radius:10px;padding:12px;outline:0;font-size:12px}.recovery-card button{width:100%;border:0;border-radius:999px;padding:12px 20px;font-size:12px;margin-top:16px;background:#728878;color:#fff;cursor:pointer}.recovery-card button.secondary{background:transparent;border:1px solid #cbd4cc;color:#63746a}.recovery-msg{text-align:center;padding:15px;border-radius:13px;background:#f8f4ed;color:#7f887f;font-size:12px;line-height:1.8}.error{background:#f7eeee;color:#8b6868}.success{background:#f1f5ee;color:#65736b}.back-home{display:block;text-align:center;margin-top:18px;font-size:11px;color:#718078}
</style>
</head>
<body>
<div class="recovery-page"><main class="recovery-card">
  <div class="recovery-brand"><img src="logo.png"><h1>Episteme 知屿</h1><p>TRUE KNOWLEDGE BELONGS TO NO ONE.</p></div>
  <div id="state"><h2>设置新密码</h2><p class="intro">你的找回链接已经打开。完成后即可使用新密码登录知屿。</p><div id="userBox"></div><form id="resetForm"><label>新密码<input type="password" name="password" minlength="6" required autocomplete="new-password" placeholder="至少 6 位"></label><label>确认新密码<input type="password" name="confirm" minlength="6" required autocomplete="new-password" placeholder="再次输入新密码"></label><button>保存新密码</button></form><a class="back-home" href="./">返回知屿首页</a></div>
</main></div>
<script src="config.js"></script>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const CFG=window.EPISTEME_CONFIG||{};
const sb=createClient(CFG.SUPABASE_URL,CFG.SUPABASE_PUBLISHABLE_KEY);
const state=document.getElementById('state');
const form=document.getElementById('resetForm');
const userBox=document.getElementById('userBox');
function showMessage(title,text,cls=''){
 state.innerHTML=`<h2>${title}</h2><div class="recovery-msg ${cls}">${text}</div><a class="back-home" href="./">返回知屿首页</a>`;
}
async function init(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){showMessage('链接已失效','这个找回链接可能已经过期或已经使用过。请回到登录页重新发送找回邮件。','error');return}
 const {data:profile}=await sb.from('profiles').select('username').eq('id',session.user.id).maybeSingle();
 const username=profile?.username||session.user.user_metadata?.username||session.user.email?.split('@')[0]||'知屿成员';
 userBox.innerHTML=`<div class="recovery-user">你的知屿用户名<b>${escapeHtml(username)}</b></div>`;
 form.addEventListener('submit',async e=>{
   e.preventDefault();
   const fd=new FormData(form),password=fd.get('password'),confirm=fd.get('confirm');
   if(password!==confirm){showFormError('两次输入的密码不一致。');return}
   if(String(password).length<6){showFormError('密码至少需要 6 位。');return}
   const {error}=await sb.auth.updateUser({password});
   if(error){showFormError('密码修改失败，请重新打开邮件链接后再试。');return}
   await sb.auth.signOut();
   showMessage('密码已更新','你的新密码已经设置成功。<br>刚才的找回链接已完成使用，请返回首页重新登录。','success');
 });
}
function showFormError(message){
 let box=document.getElementById('formError');
 if(!box){box=document.createElement('div');box.id='formError';box.className='recovery-msg error';form.prepend(box)}
 box.textContent=message;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
await init();
</script>
</body>
</html>
