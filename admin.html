.admin-wrap{width:min(1180px,92vw);margin:0 auto;padding:54px 0 90px}.admin-top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.admin-top h1{font-size:clamp(34px,5vw,58px);margin:4px 0}.admin-top p{color:#65706a}.role-pill{display:inline-flex;padding:8px 13px;border-radius:999px;background:#e7efdf;font-size:13px}.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.admin-tab{border:1px solid #d8ddd5;background:#fff;border-radius:12px;padding:10px 15px;cursor:pointer}.admin-tab.active{background:#1f2923;color:#fff}.admin-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.admin-card{background:#fff;border:1px solid #e2e5df;border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(40,50,40,.05)}.admin-card h2{margin:0 0 16px}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:12px 8px;border-bottom:1px solid #edf0eb;text-align:left;font-size:14px;vertical-align:top}.admin-table th{color:#68716b;font-weight:600}.mini{padding:7px 10px;border:1px solid #d8ddd5;border-radius:9px;background:#fff;cursor:pointer}.mini.ok{background:#e7efdf}.muted{color:#737b75}.empty-admin{padding:35px;text-align:center;color:#78817a}.danger{color:#9b4444}.section-note{padding:12px 14px;border-radius:12px;background:#f7f5ea;font-size:13px;line-height:1.6;margin-bottom:16px}.manager-list{display:grid;gap:10px}.manager-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border:1px solid #e4e7e1;border-radius:12px}.manager-row small{display:block;color:#78817a;margin-top:3px}.subject-list{display:grid;gap:8px}.subject-list-row{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid #e2e6e0;background:#fff;border-radius:13px;padding:15px 16px;cursor:pointer;font:inherit}.subject-list-row:hover{background:#f7f9f5}.subject-list-row span:first-child{display:grid;gap:4px}.subject-list-row small{color:#78817a}.subject-arrow{font-size:20px;color:#6f7972}.toolbar-admin{display:flex;justify-content:space-between;align-items:center;gap:12px}.subject-report{margin-top:20px}.report-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.report-head h2{margin-bottom:4px}.report-deadline{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:18px 0;padding:16px;border-radius:14px;background:#f5f6f2}.report-deadline>div:first-child{display:grid;gap:3px}.report-deadline small{color:#6f7972}.report-deadline b{font-size:25px}.report-deadline span{font-size:12px;color:#7b847d}.deadline-editor{display:flex;gap:7px;align-items:center}.deadline-editor input{border:1px solid #d8ddd5;border-radius:9px;padding:8px 10px;background:#fff}.report-columns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.report-columns section{padding:15px;border:1px solid #e5e8e3;border-radius:13px}.report-columns h3{margin:0 0 7px;font-size:15px}.report-columns p{margin:0;color:#68716b;line-height:1.6;font-size:13px}.report-foot{margin-top:15px;font-size:12px;color:#7c857e}.admin-loading{padding:42px 24px;text-align:center;color:#69736c}.admin-loading b{display:block;color:#334138;margin-bottom:7px}.admin-diagnostic{margin-top:15px;padding:14px 16px;border-radius:13px;background:#f7f5ea;text-align:left;font-size:13px;line-height:1.6}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.admin-top{display:block}.admin-top .role-pill{margin-top:12px}.report-columns{grid-template-columns:1fr}.report-deadline{display:block}.deadline-editor{margin-top:12px;flex-wrap:wrap}}
